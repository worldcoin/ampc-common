{inheritance: true,reviews: {profile: chill,high_level_summary_in_walkthrough: true,review_details: true,sequence_diagrams: false,estimate_code_review_effort: false,suggested_labels: false,suggested_reviewers: false,in_progress_fortune: false,poem: false,path_instructions: [{path: "**/*",instructions: "Report actionable correctness, security, data-integrity and reliability defects introduced by this change. Trace relevant callers and failure paths before asserting a bug; cite the code or contract and explain impact. Avoid speculative requirements, style-only churn and duplicate findings from existing CI. For cross-repository claims, identify the source and relevant dependency revision; default-branch context is not proof of deployed compatibility. If context is unavailable, state the uncertainty rather than inventing a contract."},{path: ampc-*/**,instructions: "Check shared API and wire-format compatibility with callers at their pinned revisions. For actor/network changes, trace party ordering, cancellation, bounded resource use and error propagation. For anonymous-statistics schema changes, check migration history, rolling-version startup and rollback, including SQLx migration validation by older binaries."},{path: key-manager/**,instructions: "Check key ownership, rotation overlap, malformed input and secret exposure. Require concrete evidence before suggesting cryptographic changes."},{path: "{deploy/**,.github/workflows/**,Dockerfile*}",instructions: "Check stage/production targeting, permissions and secret handling, dependency/image revisions, rollout compatibility, startup/readiness behavior and rollback. Flag only risks supported by the actual configuration and deployment path."}]},chat: {art: false},knowledge_base: {automatic_linking_mode: auto,linked_repositories: [{repository: worldcoin/iris-mpc,instructions: "Iris MPC implementations and persistence. Check protocol and storage compatibility, recovery and differences between CPU and GPU paths where relevant."}]}}