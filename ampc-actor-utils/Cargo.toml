[package]
name = "ampc-actor-utils"
version = "0.1.0"
edition = "2021"
license = "MIT OR (Apache-2.0 WITH LLVM-exception)"
repository = "https://github.com/worldcoin/ampc-common"

[dependencies]
ampc-secret-sharing = { path = "../ampc-secret-sharing" }
tokio.workspace = true
tokio-util.workspace = true
async-trait = "~0.1"
async-channel = "2.3.1"
blake3 = "1"
futures.workspace = true
socket2 = { version = "0.6.0", features = ["all"] }
tokio-rustls = { version = "0.26.2" }
bytes = "1.7"
eyre.workspace = true
serde.workspace = true
serde_json = { workspace = true }
num_enum = "0.7.3"
rand_chacha = { version = "0.3", features = ["serde1"] }
dashmap = "6.1.0"
itertools.workspace = true
num-traits.workspace = true
rand.workspace = true
thiserror.workspace = true
aes-prng = { git = "https://github.com/tf-encrypted/aes-prng.git", branch = "dragos/display" }
metrics = "0.24.0"
rand_distr = "0.4.3"
tracing.workspace = true
hex.workspace = true
clap = { version = "4", features = ["derive"] }

# gRPC networking stack (gated behind the `grpc` feature)
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
backon = { version = "1", optional = true }

[build-dependencies]
tonic-build = { version = "0.12", optional = true }

[features]
networking_metrics = []
ripple_carry_adder = []
aes_rng_prf = []
grpc = ["dep:tonic", "dep:prost", "dep:backon", "dep:tonic-build"]

[dev-dependencies]
tracing-test = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
criterion = "0.8.1"
statrs = "0.17"
serial_test = "3"
rcgen = "0.13"
tempfile = "3.10"

[[bench]]
name = "bit_inject"
harness = false
path = "benches/bit_inject.rs"

[[bench]]
name = "reshare_mux"
harness = false
path = "benches/reshare_mux.rs"

[[bench]]
name = "grpc_vs_tcp"
harness = false
path = "benches/grpc_vs_tcp.rs"
required-features = ["grpc"]

[[example]]
name = "grpc_node"
path = "examples/grpc_node.rs"
required-features = ["grpc"]
